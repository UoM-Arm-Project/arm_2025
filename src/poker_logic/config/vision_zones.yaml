# Table zones for card detections, in the ArUco TABLE frame (metres).
# The card detector publishes x/y in this frame; the game manager assigns
# each detection to the first zone that contains it. A detector may instead
# fill CardDetection.zone itself, which overrides this file.
#
# Required zone names:
#   board     - community cards (face-up)
#   bot_hole  - the bot's own two cards, face-up in its private holder
#   seat_<n>  - where chair n turns its cards face-up at showdown
#   muck      - optional, ignored by the game logic
zones:
  - {name: board,    x_min: -0.20, x_max: 0.20, y_min: 0.20, y_max: 0.33}
  - {name: bot_hole, x_min:  0.02, x_max: 0.14, y_min: 0.05, y_max: 0.15}
  - {name: seat_1,   x_min:  0.15, x_max: 0.35, y_min: 0.25, y_max: 0.45}
  - {name: seat_2,   x_min:  0.02, x_max: 0.20, y_min: 0.36, y_max: 0.55}
  - {name: seat_3,   x_min: -0.20, x_max: -0.02, y_min: 0.36, y_max: 0.55}
  - {name: seat_4,   x_min: -0.35, x_max: -0.15, y_min: 0.25, y_max: 0.45}
  - {name: muck,     x_min: -0.30, x_max: -0.15, y_min: 0.10, y_max: 0.25}
