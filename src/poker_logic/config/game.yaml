# poker_game_manager parameters (ROS 2 params file)
poker_game_manager:
  ros__parameters:
    mode: player              # player | dealer | dealer_player
    seats: 5                  # physical chairs including the bot (2-6)
    bot_seat: 0               # chair the bot plays from; ignored in dealer mode
    first_button: 0
    small_blind: 1
    big_blind: 2
    starting_stack: 200
    chip_unit: 1              # smallest chip value (White = 1); bets snap to this

    policy: equity            # equity | baseline
    samples: 600              # Monte Carlo samples per decision (lower on a Pi)
    style: balanced           # cautious | balanced | active
    range_model: public_actions

    pot_settle_s: 0.8         # wait after a turn press before photographing the pot
    pot_tolerance: -1.0       # chips; <0 = half the chip unit
    gesture_on_check: true
    verify_bot_chips: true    # photograph the pot after the bot's chips land
    read_retries: 1           # automatic re-reads before asking the operator
    vision_timeout_s: 30.0    # a read taking longer than this counts as failed

    use_gpio_button: true     # treat any /button_count change as "turn done"

